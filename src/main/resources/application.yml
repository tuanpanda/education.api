server:
  port: ${HTTP_PLATFORM_PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: education-base

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCL}
    username: ${DB_USERNAME:EDUCATION}
    password: ${DB_PASSWORD:EDUCATION}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: EducationHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1 FROM DUAL

  jpa:
    hibernate:
      ddl-auto: none
    # Log SQL: bật profile local-logging (application-local-logging.yml), không bật ở đây.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          batch_size: 20
          # Trùng múi giờ JVM (EducationApplication.APP_TIME_ZONE) -> LocalDateTime ghi/đọc không bị lệch.
          time_zone: Asia/Ho_Chi_Minh
        boot:
          allow_jdbc_metadata_access: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

app:
  cors:
    # Origin được gọi API cross-origin, phân tách bằng dấu phẩy. Prod: không có mặc định (rỗng = same-origin).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088,http://localhost:3000}
  storage:
    base-dir: ${APP_STORAGE_DIR:./outputs}
  security:
    jwt:
      # Chỉ dùng cho môi trường dev. Profile prod bắt buộc truyền JWT_SECRET (>= 32 ký tự).
      secret: ${JWT_SECRET:dev-only-education-jwt-secret-change-me-0123456789}
      issuer: ${JWT_ISSUER:education-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true

# DEBUG/TRACE (SQL, bind parameter): SPRING_PROFILES_ACTIVE=local-logging (xem README).
logging:
  level:
    root: INFO
    com.education.base: INFO
    org.hibernate.SQL: INFO
