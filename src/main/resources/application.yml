server:
  port: ${HTTP_PLATFORM_PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  # Lấy IP / giao thức thật của client từ X-Forwarded-For / X-Forwarded-Proto khi chạy sau reverse proxy nội bộ
  # (nginx của UI, Caddy), dùng cho rate limit và nhật ký hệ thống (request.getRemoteAddr()). Tomcat (RemoteIpValve) chỉ
  # tin header này khi request đến từ proxy có IP nội bộ - mặc định 10/8, 192.168/16, 172.16/12 (mạng Docker), 169.254/16,
  # 127/8, 100.64/10 - client gọi thẳng API từ IP public không giả mạo được. Đổi dải tin cậy:
  # SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (regex). Kiểm thử: ForwardedHeadersConfigurationTest.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: education-base

  # Không truyền SPRING_PROFILES_ACTIVE (vd. chạy EducationApplication trong IntelliJ) -> profile dev
  # (application-dev.yml có JWT secret dev). Docker / production luôn chạy profile prod.
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCL}
    username: ${DB_USERNAME:EDUCATION}
    password: ${DB_PASSWORD:EDUCATION}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: EducationHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1 FROM DUAL

  jpa:
    hibernate:
      ddl-auto: none
    # Log SQL: bật profile local-logging (application-local-logging.yml), không bật ở đây.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          batch_size: 20
          # Trùng múi giờ JVM (EducationApplication.APP_TIME_ZONE) -> LocalDateTime ghi/đọc không bị lệch.
          time_zone: Asia/Ho_Chi_Minh
        boot:
          allow_jdbc_metadata_access: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

app:
  cors:
    # Origin được gọi API cross-origin, phân tách bằng dấu phẩy. Prod: không có mặc định (rỗng = same-origin).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088,http://localhost:3000}
  storage:
    base-dir: ${APP_STORAGE_DIR:./outputs}
  receipt:
    # Thông tin trung tâm in trên phiếu thu (PaymentServiceImpl / ReceiptHtmlRenderer). Tên rỗng = tên chủ tài khoản
    # ngân hàng đang dùng; địa chỉ / điện thoại rỗng = không in dòng đó.
    center-name: ${RECEIPT_CENTER_NAME:}
    center-address: ${RECEIPT_CENTER_ADDRESS:}
    center-phone: ${RECEIPT_CENTER_PHONE:}
  security:
    jwt:
      # KHÔNG có giá trị mặc định: bắt buộc JWT_SECRET (>= 32 byte). Chỉ profile dev (application-dev.yml)
      # và profile test có secret riêng. Profile prod từ chối khởi động nếu dùng secret dev/test.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:education-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      # Nhiều tab làm mới cùng lúc bằng một refresh token trong khoảng này không bị coi là dùng lại.
      refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:10s}
    cookie:
      # Access / refresh token nằm trong cookie HttpOnly (không trả trong body, không lưu localStorage).
      # Secure: chỉ gửi qua HTTPS. Mặc định true; profile dev đặt false (http://localhost). Chạy qua HTTP thuần
      # trên IP/tên máy (không phải localhost) với Secure=true thì trình duyệt bỏ cookie -> không đăng nhập được.
      secure: ${AUTH_COOKIE_SECURE:true}
      # Strict (mặc định) hoặc Lax. UI và API phải cùng site (cùng host khác cổng, hoặc chung tên miền gốc).
      same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    auth:
      lockout:
        # Cứ mỗi N lần sai mật khẩu liên tiếp thì khóa tạm thời; lần khóa sau gấp đôi lần trước, tối đa max-duration.
        max-failed-attempts: ${AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
        base-duration: ${AUTH_LOCKOUT_BASE_DURATION:15m}
        max-duration: ${AUTH_LOCKOUT_MAX_DURATION:24h}
      rate-limit:
        # Giới hạn tần suất /api/v1/auth/login và /refresh (cửa sổ trượt trong bộ nhớ, theo từng instance).
        enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
        window: ${AUTH_RATE_LIMIT_WINDOW:5m}
        # Theo IP rộng (cả trung tâm dùng chung một IP public / NAT); theo tên đăng nhập + khóa tài khoản giữ chặt.
        login-per-ip: ${AUTH_RATE_LIMIT_LOGIN_PER_IP:200}
        login-per-username: ${AUTH_RATE_LIMIT_LOGIN_PER_USERNAME:10}
        refresh-per-ip: ${AUTH_RATE_LIMIT_REFRESH_PER_IP:120}
        refresh-per-user: ${AUTH_RATE_LIMIT_REFRESH_PER_USER:60}
    # Giới hạn tần suất tổng quát (RequestRateLimitFilter, cùng bộ đếm trong bộ nhớ với đăng nhập): theo IP và theo
    # người dùng đã đăng nhập; 0 = tắt chiều đó. Vượt ngưỡng -> HTTP 429 + Retry-After.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-tracked-keys: ${RATE_LIMIT_MAX_TRACKED_KEYS:100000}
      rules:
        # Đổi mật khẩu (chống dò mật khẩu cũ bằng phiên đã đăng nhập).
        change-password:
          paths: /api/v1/auth/change-password
          methods: POST
          window: ${RATE_LIMIT_CHANGE_PASSWORD_WINDOW:15m}
          per-ip: ${RATE_LIMIT_CHANGE_PASSWORD_PER_IP:200}
          per-user: ${RATE_LIMIT_CHANGE_PASSWORD_PER_USER:5}
        # Ngân sách mặc định cho cổng học sinh. Theo IP mặc định tắt: cả lớp ở trung tâm dùng chung một IP (NAT).
        portal:
          paths: /api/v1/portal/**
          window: ${RATE_LIMIT_PORTAL_WINDOW:5m}
          per-ip: ${RATE_LIMIT_PORTAL_PER_IP:0}
          per-user: ${RATE_LIMIT_PORTAL_PER_USER:300}
        # Mọi request upload (multipart) tới API: tải file, nhập Excel, (GĐ2) nộp bài.
        upload:
          paths: /api/**
          methods: POST,PUT,PATCH
          multipart-only: true
          window: ${RATE_LIMIT_UPLOAD_WINDOW:1h}
          per-ip: ${RATE_LIMIT_UPLOAD_PER_IP:300}
          per-user: ${RATE_LIMIT_UPLOAD_PER_USER:60}
    # Bật khi API được đưa ra Internet (docker-compose.prod.yml): chặn khởi động nếu cookie không Secure hoặc CORS
    # có origin không phải https:// (InternetExposureValidator). Mặc định false: Docker cục bộ chạy như cũ.
    internet-facing: ${APP_INTERNET_FACING:false}
  audit:
    # Nhật ký hệ thống SYS_AUDIT_LOGS (V17_3). Ghi lỗi (bảng chưa tạo...) chỉ log WARN, không làm hỏng request.
    enabled: ${AUDIT_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true
    # Swagger UI đọc cookie XSRF-TOKEN và gửi header X-XSRF-TOKEN cho request ghi (CSRF bật cho cookie phiên).
    csrf:
      enabled: true

# DEBUG/TRACE (SQL, bind parameter): SPRING_PROFILES_ACTIVE=dev,local-logging (xem README).
logging:
  level:
    root: INFO
    com.education.base: INFO
    org.hibernate.SQL: INFO
