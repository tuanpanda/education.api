server:
  port: ${HTTP_PLATFORM_PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: education-base

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCL}
    username: ${DB_USERNAME:EDUCATION}
    password: ${DB_PASSWORD:EDUCATION}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: EducationHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1 FROM DUAL

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          batch_size: 20
        boot:
          allow_jdbc_metadata_access: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

app:
  storage:
    base-dir: ${APP_STORAGE_DIR:./outputs}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true

logging:
  level:
    root: INFO
    com.education.base: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
