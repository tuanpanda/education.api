# Profile production — luôn bật khi chạy image Docker.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    enabled: false

app:
  security:
    jwt:
      # Bắt buộc cấu hình qua biến môi trường, không có giá trị mặc định ở production.
      secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.education.base: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
