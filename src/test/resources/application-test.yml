# Profile dùng cho unit/slice test. Không kết nối Oracle.
# Các test hiện tại dùng Mockito / @WebMvcTest nên không load DataSource.
spring:
  application:
    name: education-base-test
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  storage:
    base-dir: ${java.io.tmpdir}/education-test-outputs
  security:
    jwt:
      secret: test-only-education-jwt-secret-0123456789abcdef
      issuer: education-api-test
      access-token-ttl: 15m
      refresh-token-ttl: 7d
