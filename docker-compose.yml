name: education-api

services:
  api:
    image: education-api:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    ports:
      - "${SERVER_PORT:-8090}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      TZ: Asia/Ho_Chi_Minh
      # Rỗng = chỉ same-origin (UI gọi /api qua nginx). Thêm origin khi UI chạy ở domain/cổng khác.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_URL: ${DB_URL:-jdbc:oracle:thin:@//host.docker.internal:1521/ORCL}
      DB_USERNAME: ${DB_USERNAME:-EDUCATION}
      DB_PASSWORD: ${DB_PASSWORD:-EDUCATION}
      APP_STORAGE_DIR: /app/outputs
      # Thông tin trung tâm in trên phiếu thu (rỗng = tên chủ tài khoản ngân hàng đang dùng, không in địa chỉ / SĐT).
      RECEIPT_CENTER_NAME: ${RECEIPT_CENTER_NAME:-}
      RECEIPT_CENTER_ADDRESS: ${RECEIPT_CENTER_ADDRESS:-}
      RECEIPT_CENTER_PHONE: ${RECEIPT_CENTER_PHONE:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>= 32 characters)}
      JWT_ISSUER: ${JWT_ISSUER:-education-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      # Chống dò mật khẩu / refresh token xoay vòng (mặc định như application.yml; đổi trong .env).
      JWT_REFRESH_REUSE_GRACE: ${JWT_REFRESH_REUSE_GRACE:-10s}
      AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS: ${AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_BASE_DURATION: ${AUTH_LOCKOUT_BASE_DURATION:-15m}
      AUTH_LOCKOUT_MAX_DURATION: ${AUTH_LOCKOUT_MAX_DURATION:-24h}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-5m}
      AUTH_RATE_LIMIT_LOGIN_PER_IP: ${AUTH_RATE_LIMIT_LOGIN_PER_IP:-30}
      AUTH_RATE_LIMIT_LOGIN_PER_USERNAME: ${AUTH_RATE_LIMIT_LOGIN_PER_USERNAME:-10}
      AUTH_RATE_LIMIT_REFRESH_PER_IP: ${AUTH_RATE_LIMIT_REFRESH_PER_IP:-120}
      AUTH_RATE_LIMIT_REFRESH_PER_USER: ${AUTH_RATE_LIMIT_REFRESH_PER_USER:-60}
      # Giới hạn tần suất tổng quát (đổi mật khẩu, /api/v1/portal/**, upload) - mặc định như application.yml.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CHANGE_PASSWORD_PER_USER: ${RATE_LIMIT_CHANGE_PASSWORD_PER_USER:-5}
      RATE_LIMIT_PORTAL_PER_USER: ${RATE_LIMIT_PORTAL_PER_USER:-300}
      RATE_LIMIT_UPLOAD_PER_USER: ${RATE_LIMIT_UPLOAD_PER_USER:-60}
      # Nhật ký hệ thống SYS_AUDIT_LOGS (chạy migration V17_3 trước; chưa chạy thì chỉ log WARN).
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      # Docker cục bộ: false. Triển khai Internet dùng docker-compose.prod.yml (true).
      APP_INTERNET_FACING: ${APP_INTERNET_FACING:-false}
      # IP thật của client từ X-Forwarded-For (API chạy sau nginx của UI); Tomcat chỉ tin header từ IP nội bộ.
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-native}
      # Cookie đăng nhập HttpOnly: Secure (chỉ gửi qua HTTPS; trình duyệt vẫn chấp nhận trên http://localhost).
      # Mở UI qua HTTP bằng IP / tên máy thì đặt AUTH_COOKIE_SECURE=false trong .env (hoặc dùng HTTPS).
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
    volumes:
      - education-outputs:/app/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    image: education-ui:${IMAGE_TAG:-prod}
    build:
      context: ../education_ui
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    ports:
      - "${UI_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  education-outputs:
