# =============================================================================
# EDUCATION - VI DU TRIEN KHAI INTERNET (HTTPS) - xem docs/deploy-internet.md
#
#   Internet --443/80--> caddy (TLS Let's Encrypt, HSTS) --> ui (nginx, /api -> api) --> api (Spring Boot)
#                                                                                      \--> Oracle (host, 1521 KHONG mo ra ngoai)
#
# CHI caddy publish cong (80, 443/tcp, 443/udp). api va ui khong co "ports": chi truy cap trong mang Docker.
# File doc lap voi docker-compose.yml (Docker cuc bo, cong 8090/8088) - project rieng "education-prod".
#
# Chay:
#   cp deploy/env.prod.example .env.prod      # roi dien PUBLIC_DOMAIN, ACME_EMAIL, JWT_SECRET, DB_PASSWORD...
#   docker compose -f docker-compose.prod.yml --env-file .env.prod config    # kiem tra truoc
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# =============================================================================
name: education-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:${CADDY_VERSION:-2.8-alpine}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required (vd hocsinh.trungtam.vn)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required (email nhan canh bao chung chi)}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ui
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  ui:
    image: education-ui:${IMAGE_TAG:-prod}
    build:
      context: ${UI_BUILD_CONTEXT:-../education_ui}
      dockerfile: Dockerfile
      target: production
    # Khong publish cong: chi Caddy goi vao (http://ui:80).
    expose:
      - "80"
    depends_on:
      - api
    logging: *default-logging
    restart: unless-stopped

  api:
    image: education-api:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Khong publish cong: UI nginx goi http://api:8080 trong mang Docker.
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      TZ: Asia/Ho_Chi_Minh
      # Bat kiem tra cau hinh Internet: cookie Secure + CORS chi https:// (sai -> API khong khoi dong).
      APP_INTERNET_FACING: "true"
      # UI va API cung origin (https://PUBLIC_DOMAIN, /api qua nginx): de trong. Chi them origin https:// khi can.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_URL: ${DB_URL:-jdbc:oracle:thin:@//host.docker.internal:1521/ORCL}
      DB_USERNAME: ${DB_USERNAME:-EDUCATION}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_STORAGE_DIR: /app/outputs
      RECEIPT_CENTER_NAME: ${RECEIPT_CENTER_NAME:-}
      RECEIPT_CENTER_ADDRESS: ${RECEIPT_CENTER_ADDRESS:-}
      RECEIPT_CENTER_PHONE: ${RECEIPT_CENTER_PHONE:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>= 32 characters)}
      JWT_ISSUER: ${JWT_ISSUER:-education-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      JWT_REFRESH_REUSE_GRACE: ${JWT_REFRESH_REUSE_GRACE:-10s}
      # Cookie dang nhap: luon Secure tren Internet (APP_INTERNET_FACING tu choi false).
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS: ${AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_BASE_DURATION: ${AUTH_LOCKOUT_BASE_DURATION:-15m}
      AUTH_LOCKOUT_MAX_DURATION: ${AUTH_LOCKOUT_MAX_DURATION:-24h}
      AUTH_RATE_LIMIT_ENABLED: "true"
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-5m}
      # Ca trung tam dung chung 1 IP public (NAT) -> theo IP rong (200 / 5 phut); theo ten dang nhap (10) giu chat.
      AUTH_RATE_LIMIT_LOGIN_PER_IP: ${AUTH_RATE_LIMIT_LOGIN_PER_IP:-200}
      AUTH_RATE_LIMIT_LOGIN_PER_USERNAME: ${AUTH_RATE_LIMIT_LOGIN_PER_USERNAME:-10}
      AUTH_RATE_LIMIT_REFRESH_PER_IP: ${AUTH_RATE_LIMIT_REFRESH_PER_IP:-120}
      AUTH_RATE_LIMIT_REFRESH_PER_USER: ${AUTH_RATE_LIMIT_REFRESH_PER_USER:-60}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_MAX_TRACKED_KEYS: ${RATE_LIMIT_MAX_TRACKED_KEYS:-100000}
      RATE_LIMIT_CHANGE_PASSWORD_WINDOW: ${RATE_LIMIT_CHANGE_PASSWORD_WINDOW:-15m}
      RATE_LIMIT_CHANGE_PASSWORD_PER_IP: ${RATE_LIMIT_CHANGE_PASSWORD_PER_IP:-30}
      RATE_LIMIT_CHANGE_PASSWORD_PER_USER: ${RATE_LIMIT_CHANGE_PASSWORD_PER_USER:-5}
      RATE_LIMIT_PORTAL_WINDOW: ${RATE_LIMIT_PORTAL_WINDOW:-5m}
      RATE_LIMIT_PORTAL_PER_IP: ${RATE_LIMIT_PORTAL_PER_IP:-0}
      RATE_LIMIT_PORTAL_PER_USER: ${RATE_LIMIT_PORTAL_PER_USER:-300}
      RATE_LIMIT_UPLOAD_WINDOW: ${RATE_LIMIT_UPLOAD_WINDOW:-1h}
      RATE_LIMIT_UPLOAD_PER_IP: ${RATE_LIMIT_UPLOAD_PER_IP:-300}
      RATE_LIMIT_UPLOAD_PER_USER: ${RATE_LIMIT_UPLOAD_PER_USER:-60}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      # IP that cua client: Caddy -> nginx -> Tomcat (X-Forwarded-For; Tomcat chi tin proxy IP noi bo).
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - education-outputs:/app/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Image JRE khong co curl: goi /api/v1/health bang bash /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  # File dinh kem / bien lai. Ten co dinh de script sao luu tim thay (scripts/ops/backup.*).
  education-outputs:
    name: ${UPLOADS_VOLUME:-education-prod-outputs}
